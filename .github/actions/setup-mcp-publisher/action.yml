name: Set up MCP Publisher
description: Install a pinned, checksum-verified MCP publisher on Linux x64.
runs:
  using: composite
  steps:
    - name: Download and verify mcp-publisher
      shell: bash
      env:
        MCP_PUBLISHER_VERSION: v1.8.1
        MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
      run: |
        set -euo pipefail

        install_dir="$(mktemp -d "$RUNNER_TEMP/mcp-publisher.XXXXXX")"
        archive="$install_dir/mcp-publisher.tar.gz"
        curl --fail --silent --show-error --location --retry 3 \
          "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz" \
          --output "$archive"
        printf '%s  %s\n' "$MCP_PUBLISHER_SHA256" "$archive" | sha256sum --check --strict
        tar -xzf "$archive" -C "$install_dir" mcp-publisher
        echo "$install_dir" >> "$GITHUB_PATH"
