name: Publish MCP Registry

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: New registry version to publish (for example, 1.8.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set registry version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          version="$INPUT_VERSION"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi

          if [[ -z "${version//[[:space:]]/}" ]]; then
            echo "::error::A new registry version is required."
            exit 1
          fi

          jq --arg version "$version" '.version = $version' server.json > server.tmp
          mv server.tmp server.json

      - name: Install mcp-publisher
        uses: ./.github/actions/setup-mcp-publisher

      - name: Validate registry manifest
        run: mcp-publisher validate

      - name: Authenticate to MCP Registry
        run: mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: mcp-publisher publish
